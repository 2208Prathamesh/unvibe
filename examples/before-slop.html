<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Analytics AI — Welcome Back!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow-x: hidden;
      width: 100vw;
      background: #0f0f1a;
      color: #f4f4ff;
      font-family: Inter, system-ui, sans-serif;
    }
    .shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, #1b1536, #0d1226);
      padding: 19px;
      border-right: 1px solid rgba(139, 92, 246, 0.5);
    }
    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: #a78bfa;
      margin-bottom: 13px;
    }
    .nav-btn {
      display: block;
      padding: 11px 13px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6);
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.65);
      color: #ffffff;
      font-weight: 800;
      margin-bottom: 9px;
      transition: all 0.3s ease;
      outline: none;
      cursor: pointer;
    }
    .main { flex: 1; padding: 28px; position: relative; }
    .blob {
      position: absolute;
      top: 10px;
      right: 40px;
      width: 260px;
      height: 260px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.45), transparent 70%);
      filter: blur(40px);
    }
    .hero-title {
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(90deg, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 11px;
    }
    .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; margin-top: 21px; }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(139, 92, 246, 0.45);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
      border-radius: 24px;
      padding: 20px;
      transition: all 0.25s ease;
    }
    .metric { font-size: 32px; font-weight: 900; }
    .search-box {
      margin-top: 13px;
      padding: 10px;
      border-radius: 9999px;
      border: 1px solid #8b5cf6;
      background: #17172b;
      color: #ffffff;
      outline: none;
    }
    @keyframes floaty {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }
    .floating { animation: floaty 3s infinite; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="eyebrow">NAVIGATION</div>
      <div onclick="void(0)" class="nav-btn">🏠 Dashboard</div>
      <div onclick="void(0)" class="nav-btn">📥 Invoices</div>
      <div onclick="void(0)" class="nav-btn">🚀 AI Insights</div>
    </aside>
    <main class="main">
      <div class="blob"></div>
      <span class="uppercase tracking-widest bg-gradient-to-r from-purple-600 to-blue-500">Introducing Ledger 2.0 ✨</span>
      <h1 class="hero-title bg-clip-text text-transparent font-black">Welcome back, Alex! 👋</h1>
      <p>Supercharge your AI-powered revenue analytics!! Trusted by 10,000+ teams worldwide.</p>
      <input type="text" class="search-box text-xs" placeholder="Search anything..." />
      <div class="card-grid">
        <div class="card floating animate-pulse">
          <div class="eyebrow">TOTAL REVENUE</div>
          <div class="metric">$123,456</div>
          <p>+12%!!</p>
        </div>
        <div class="card">
          <div class="eyebrow">ACTIVE USERS</div>
          <div class="metric">18 👤</div>
          <p>Lorem ipsum dolor sit amet</p>
        </div>
        <div class="card">
          <div class="eyebrow">PRO PLAN ✨</div>
          <div class="metric">$48,210</div>
          <div onclick="void(0)" class="nav-btn mt-[13px] outline-none transition-all">Unlock Magic 🔥</div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
